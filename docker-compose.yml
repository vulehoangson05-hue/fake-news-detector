# Local development services for vnfake.
# Usage: `make docker-up` / `make docker-down`.
# Data persisted to named volumes; safe to restart.

services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: vnfake-qdrant
    ports:
      - "6333:6333" # HTTP / REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: vnfake-mlflow
    ports:
      - "5000:5000"
    entrypoint: ["mlflow"]
    command:
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --default-artifact-root=/mlflow/artifacts
      - --serve-artifacts
    volumes:
      - mlflow_storage:/mlflow
    restart: unless-stopped

volumes:
  qdrant_storage:
  mlflow_storage:
