[project]
name = "vnfake"
version = "0.1.0"
description = "Vietnamese Fake News Detection (RAG + fine-tuned PhoBERT/XLM-R)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "VNFake Team" }]

dependencies = [
    # Config / IO
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Data / NLP
    "pandas>=2.2",
    "numpy>=1.26",
    "datasets>=2.18",
    "py_vncorenlp>=0.1.4",
    "underthesea>=6.8",
    "datasketch>=1.6",
    # Retrieval
    "qdrant-client>=1.9",
    "FlagEmbedding>=1.2",
    "sentence-transformers>=2.7",
    # Models / training
    "torch>=2.2",
    "transformers>=4.41",
    "accelerate>=0.30",
    # Tracking / data versioning
    "mlflow>=2.13",
    "dvc>=3.50",
    # Serving
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]
ui = ["streamlit>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vnfake"]

[tool.uv]
package = true

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "TID"]
ignore = ["E501"]  # enforced by ruff format

[tool.ruff.lint.isort]
known-first-party = ["vnfake"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------- mypy ----------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src/vnfake"]
plugins = ["pydantic.mypy"]

# ---------- pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services (Qdrant, GPU, ...)",
]

# ---------- coverage ----------
[tool.coverage.run]
source = ["src/vnfake"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
