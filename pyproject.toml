[project]
name = "vnfake"
version = "0.1.0"
description = "Vietnamese Fake News Detection (RAG + fine-tuned PhoBERT/XLM-R)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "VNFake Team" }]

dependencies = [
    # Config / IO
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Data / NLP
    "pandas>=2.2",
    "numpy>=1.26",
    "datasets>=2.18",
    "py_vncorenlp>=0.1.4",
    "underthesea>=6.8",
    "datasketch>=1.6",
    # Retrieval
    "qdrant-client>=1.10",
    "FlagEmbedding>=1.2",
    "sentence-transformers>=2.7",
    "tqdm>=4.66",             # NEW: progress bar for scripts/03_index_kb.py
    "google-genai>=1.0",      # Phase 2.5: Gemini Flash query rewrite SDK (Task 2)
    "feedparser>=6.0",        # Phase 2.5: RSS XML parsing for Pipeline D audit & ingest (Task 4)
    "trafilatura>=1.10",      # Phase 2.5: Full-text article extraction from HTML for RSS (Task 4)
    # Models / training
    "torch>=2.2",
    "transformers>=4.41",
    "accelerate>=0.30",
    # Tracking / data versioning
    "mlflow>=2.13",
    "dvc>=3.50",
    # Serving
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    "types-tqdm",
]
ui = ["streamlit>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vnfake"]

[tool.uv]
package = true
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "TID"]
ignore = ["E501"]  # enforced by ruff format

[tool.ruff.lint.isort]
known-first-party = ["vnfake", "app"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------- mypy ----------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src/vnfake", "app"]
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = [
    "underthesea.*",
    "py_vncorenlp.*",
    "FlagEmbedding.*",
    "datasketch.*",
    "google.*",
    "feedparser.*",
    "trafilatura.*",
    "gradio.*",
]
ignore_missing_imports = true

# ---------- pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services (Qdrant, GPU, ...)",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

# ---------- coverage ----------
[tool.coverage.run]
source = ["src/vnfake"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
